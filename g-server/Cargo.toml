[package]
name = "g-server"
version = "0.0.0"
edition = "2024"
authors = ["Muhammad Fathir Irhas <fathir.irhas@gmail.com>"]
description = "..."
license = "MIT"
repository = "https://github.com/mfirhas/g-server"
documentation = "https://docs.rs/g-server"
keywords = ["http", "sse", "websocket", "mcp", "server"]
categories = ["rust-patterns"]
rust-version = "1.86.0"
exclude = [
  "**/*_test.rs",
  "tests/**",
  "benches/**",
  "examples/**",
  ".github/**",
  ".gitignore",
  "Makefile",
  "AUDIT.md",
  "AGENTS.md",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
g-server-macro = { path = "../g-server-macro" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tower = "0.5"
tower-http = "0.7"
http = "1"
axum = "0.8.9"
bytes = "1"
http-body-util = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tower = "0.5"
tower-http = "0.7"
reqwest = "0.13.4"
